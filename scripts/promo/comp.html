<!doctype html>
<!--
  The promo's compositor (`npm run promo`). Opened from disk by scripts/promo/index.mjs, which calls
  comp.frame(n) for every video frame and screenshots the result. Everything drawn here is a pure
  function of the frame number: no timers, no CSS animations.

  Layout (1920×1080): a brand-blue caption band on top, the filmed plate under it. The plate is
  filmed with the site's navbar, which sits hidden behind the band, so the band reads as the header.
-->
<html lang="no">
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Nunito Sans";
    src: url("../../src/assets/fonts/nunito-sans-latin.woff2") format("woff2");
    font-weight: 200 1000;
  }
  :root { --blue: #24374c; --blue-dark: #0f1923; --paper: #eae8e3; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  body { font-family: "Nunito Sans", sans-serif; color: #fff; position: relative; }
  #stage { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; background: var(--paper); }
  #stage img { position: absolute; left: 0; width: 1920px; will-change: transform; }
  #tap { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
  #band {
    position: absolute; left: 0; right: 0; top: 0; background: var(--blue);
    box-shadow: 0 6px 24px rgba(15, 25, 35, 0.28); overflow: hidden;
  }
  #brand { position: absolute; right: 56px; top: 0; height: 144px; display: flex; align-items: center; gap: 14px;
    font-size: 34px; font-weight: 700; letter-spacing: -0.01em; opacity: 0.85; }
  #brand svg { width: 36px; height: 36px; }
  #caption { position: absolute; left: 56px; right: 340px; top: 0; height: 144px; display: flex;
    flex-direction: column; justify-content: center; }
  #head { font-size: 54px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; }
  #sub { margin-top: 4px; font-size: 28px; font-weight: 500; opacity: 0.8; white-space: nowrap; }
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 0 64px; }
  #end .logo { display: flex; align-items: center; gap: 18px; font-size: 46px; font-weight: 700; opacity: 0.85; }
  #end .logo svg { width: 50px; height: 50px; }
  #end h1 { margin-top: 56px; font-size: 104px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; }
  #end p { margin-top: 30px; font-size: 38px; font-weight: 500; opacity: 0.8; line-height: 1.3; }
  #end .url { margin-top: 64px; background: #fff; color: var(--blue); border-radius: 999px;
    padding: 22px 56px; font-size: 50px; font-weight: 800; letter-spacing: -0.01em; }
</style>
<body>
  <div id="stage">
    <img id="prev" alt="" />
    <img id="cur" alt="" />
    <div id="tap"></div>
  </div>
  <div id="band">
    <div id="brand"></div>
    <div id="caption"><div id="head"></div><div id="sub"></div></div>
    <div id="end">
      <div class="logo"></div>
      <h1></h1>
      <p></p>
      <div class="url">datakart.no</div>
    </div>
  </div>
  <script type="module">
    import { BAND, BEAT, END, HEIGHT, NAVBAR as PAGE_NAVBAR, PAGE, SHOTS, WIDTH } from "./edit.mjs";

    /** The navbar's map icon (lucide "map"), so the band matches the site's header. */
    const LOGO =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>';
    /** Plate pixels per CSS pixel of the filmed page, and the navbar height hidden behind the band. */
    const PLATE_SCALE = WIDTH / PAGE.width;
    const NAVBAR = PAGE_NAVBAR * PLATE_SCALE;
    const CUT = 9; // frames a new shot takes to slide in
    const TEXT_IN = 8;
    const GROW = 12; // frames the band takes to fill the frame for the end card

    const $ = (id) => document.getElementById(id);
    const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
    const easeOut = (t) => 1 - (1 - clamp(t)) ** 3;
    const easeInOut = (t) => ((t = clamp(t)) < 0.5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2);

    let plates = {};
    let platesUrl = "";

    const plateFrame = (shot, local) => {
      const info = plates[shot.plate];
      const from = typeof shot.from === "object" ? (info.marks[shot.from.mark] ?? 0) + (shot.from.offset ?? 0) : (shot.from ?? 0);
      return Math.round(clamp(from + local * (shot.rate ?? 1), 0, info.frames - 1));
    };
    const src = (shot, n) => `${platesUrl}/${shot.plate}/${String(n).padStart(5, "0")}.jpg`;
    async function show(img, url) {
      if (!url) return void (img.style.display = "none");
      img.style.display = "";
      if (img.dataset.url !== url) {
        img.dataset.url = url;
        img.src = url;
        await img.decode();
      }
    }

    async function frame(f) {
      const i = SHOTS.findLastIndex((s) => s.at <= f);
      const shot = SHOTS[i];
      const prev = SHOTS[i - 1];
      const local = f - shot.at;
      const length = (SHOTS[i + 1]?.at ?? END) - shot.at;

      // The band: a header over footage, the whole frame for the end card.
      const grow = shot.end ? easeInOut(local / GROW) : 0;
      const band = BAND + (HEIGHT - BAND) * grow;
      $("band").style.height = `${band}px`;
      $("stage").style.top = `${BAND}px`;

      // Footage: the new shot slides in over the last frame of the one before.
      const cut = prev && !shot.end ? easeOut(local / CUT) : 1;
      const prevShot = shot.end ? prev : cut < 1 ? prev : null;
      await show($("prev"), prevShot?.plate ? src(prevShot, plateFrame(prevShot, shot.at - prevShot.at - 1)) : null);
      await show($("cur"), shot.plate ? src(shot, plateFrame(shot, local)) : null);
      for (const img of [$("prev"), $("cur")]) img.style.top = `${-NAVBAR}px`;
      $("cur").style.transform = `translateX(${(1 - cut) * WIDTH}px)`;
      $("prev").style.transform = shot.end ? "" : `translateX(${-cut * WIDTH * 0.25}px)`;

      // A tap on the page: a dot lands, then a ring spreads from it.
      const tap = $("tap");
      tap.style.display = "none";
      if (shot.plate) {
        const n = plateFrame(shot, local);
        const hit = plates[shot.plate].taps.find((t) => n >= t.frame - 7 && n < t.frame + 14);
        if (hit && cut === 1) {
          const t = n - hit.frame;
          const press = t < 0 ? easeOut((t + 7) / 7) : 1;
          const ring = t < 0 ? 0 : easeOut(t / 14);
          const size = 54 + ring * 130;
          Object.assign(tap.style, {
            display: "",
            left: `${hit.x * WIDTH}px`,
            top: `${hit.y * PAGE.height * PLATE_SCALE - NAVBAR}px`,
            width: `${size}px`,
            height: `${size}px`,
            background: `rgba(255,255,255,${0.55 * press * (1 - ring)})`,
            boxShadow: `0 0 0 ${5 - ring * 3}px rgba(36,55,76,${0.75 * press * (1 - ring)})`,
          });
        }
      }

      // Captions: the last one whose beat has passed, sliding up into place.
      const caption = shot.captions.findLast((c) => c.at * BEAT <= local) ?? shot.captions[0];
      const inAt = caption.at * BEAT + (shot.end ? GROW - 2 : 0);
      const p = easeOut((local - inAt) / TEXT_IN);
      const out = !shot.end && SHOTS[i + 1]?.end ? 1 - clamp((local - (length - 4)) / 4) : 1;
      const move = `translateY(${(1 - p) * 22}px)`;
      $("caption").style.display = shot.end ? "none" : "";
      $("brand").style.display = shot.end ? "none" : "";
      $("end").style.display = shot.end ? "" : "none";
      if (shot.end) {
        $("end").querySelector("h1").textContent = caption.text;
        $("end").querySelector("p").textContent = caption.sub ?? "";
        const parts = [...$("end").children];
        parts.forEach((el, k) => {
          const q = easeOut((local - inAt - k * 3) / TEXT_IN);
          el.style.opacity = String(q * (k === 0 ? 0.85 : k === 2 ? 0.8 : 1));
          el.style.transform = `translateY(${(1 - q) * 30}px)`;
        });
      } else {
        $("head").textContent = caption.text;
        $("sub").textContent = caption.sub ?? "";
        // A headline longer than the band shrinks to fit instead of running off the edge.
        for (const [el, size] of [[$("head"), 54], [$("sub"), 28]]) {
          el.style.fontSize = `${size}px`;
          const room = $("caption").clientWidth;
          if (el.scrollWidth > room) el.style.fontSize = `${Math.floor((size * room) / el.scrollWidth)}px`;
        }
        $("head").style.opacity = String(p * out);
        $("head").style.transform = move;
        const ps = easeOut((local - inAt - 3) / TEXT_IN);
        $("sub").style.opacity = String(0.8 * ps * out);
        $("sub").style.transform = `translateY(${(1 - ps) * 22}px)`;
      }
    }

    window.comp = {
      async init(a) {
        plates = a.plates;
        platesUrl = a.platesUrl;
        $("brand").innerHTML = `${LOGO}<span>Datakart</span>`;
        $("end").querySelector(".logo").innerHTML = `${LOGO}<span>Datakart</span>`;
        await document.fonts.load('800 54px "Nunito Sans"');
        await document.fonts.ready;
      },
      frame,
    };
  </script>
</body>
</html>
